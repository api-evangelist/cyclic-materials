aid: cyclic-materials
name: Cyclic Materials
description: 'Cyclic Materials is a Kingston, Ontario cleantech company founded in
  2021 that is building a circular supply chain for rare earth elements and other critical
  materials. It recovers neodymium-praseodymium (NdPr), samarium, gadolinium, terbium
  and dysprosium from end-of-life magnet-containing products — electric-vehicle motors,
  wind-turbine generators, MRI machines and e-waste — using its proprietary MagCycle
  magnet-separation and REEPure refining processes, and supplies recycled mixed rare
  earth oxide (rMREO) and recycled copper back into automotive, data-centre, defence
  and energy manufacturing. The company operates a REEPure commercial demonstration
  plant and a MagCycle pilot in Kingston, with a Centre of Excellence under construction
  there and campuses planned in Arizona and South Carolina. It is a materials producer,
  not a software vendor: it publishes no API, SDK, developer portal or machine-readable
  specification, and its only public application surface is an Auth0-gated supplier
  portal for recyclers, aggregators and core buyers.'
